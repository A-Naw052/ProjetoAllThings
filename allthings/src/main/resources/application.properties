spring.application.name=allthings

# Configurações do banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/db_allthings
spring.datasource.username=postgres
spring.datasource.password=postdba

#Atualizar o BD automaticamente
spring.jpa.hibernate.ddl-auto=update
 
#Exibir no Terminal o SQL sendo executado
spring.jpa.show-sql=true

#Limpar o cache para a execução do Thymeleaf
spring.thymeleaf.cache = false

#Limitar o tamanho da imagem pra 2mb
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
