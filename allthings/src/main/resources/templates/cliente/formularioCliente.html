<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cliente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/formulario.css">
</head>
<body>
    <!-- ===== CABEÇALHO ===== -->
    <header class="header">
        <div class="header__inner">
            <a href="/allthings" class="logo">
                ALL THINGS <span>tem de tudo</span>
            </a>

            <div class="search-bar">
                <input type="text" placeholder="Digite o que você procura">
                <button type="button" aria-label="Buscar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>

            <div class="header__actions">
                <a href="/fornecedores/listar" class="header__link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
                    Fornecedores
                </a>
                <a href="/clientes/listar" class="header__link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
                    Clientes
                </a>
                <a href="/produtos/listar" class="header__link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
                    Produtos
                </a>
                <a href="/categorias/listar" class="header__link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
                    Categorias
                </a>
                <a href="#" class="header__icon" aria-label="Favoritos">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 2.5 5 6 5c2 0 3.5 1 6 3.5C14.5 6 16 5 18 5c3.5 0 5.5 3.5 3.5 7.5C19 16.65 12 21 12 21z"></path></svg>
                </a>
                <a href="#" class="header__icon header__icon--cart" aria-label="Carrinho">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path></svg>
                    <span class="cart-count">1</span>
                </a>
            </div>
        </div>
    </header>

    <main class="form-wrap">
    <div class="form-page">
        <h1>Cadastro de Cliente</h1>
        <p class="form-page__subtitle">Preencha os dados do cliente abaixo</p>

        <form th:action="@{/clientes/salvar}" method="post" th:object="${cliente}" enctype="multipart/form-data">

            <input type="hidden" name="idCliente" th:field="*{idCliente}">

            <div class="form-field">
                <label for="fotoCliente">Foto: *Tamanho máximo: 5mb</label>
                <input type="file" id="fotoCliente" name="foto">
            </div>

            <div class="form-field">
                <label for="nomeCliente">Nome</label>
                <input type="text" id="nomeCliente" name="nomeCliente" th:field="*{nomeCliente}" placeholder="Nome completo">
            </div>

            <div class="form-field">
                <label for="enderecoCliente">Endereço</label>
                <input type="text" id="enderecoCliente" name="enderecoCliente" th:field="*{enderecoCliente}" placeholder="Rua, número, bairro">
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="cidadeCliente">Cidade</label>
                    <input type="text" id="cidadeCliente" name="cidadeCliente" th:field="*{cidadeCliente}" placeholder="Cidade">
                </div>

                <div class="form-field">
                    <label for="estadoCliente">Estado</label>
                    <input type="text" id="estadoCliente" name="estadoCliente" th:field="*{estadoCliente}" placeholder="UF">
                </div>
            </div>

            <div class="form-field">
                <label for="cepCliente">CEP</label>
                <input type="text" id="cepCliente" name="cepCliente" th:field="*{cepCliente}" placeholder="00000-000">
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="cpfCliente">CPF</label>
                    <input type="text" id="cpfCliente" name="cpfCliente" th:field="*{cpfCliente}" placeholder="000.000.000-00">
                </div>

                <div class="form-field">
                    <label for="rgCliente">RG</label>
                    <input type="text" id="rgCliente" name="rgCliente" th:field="*{rgCliente}" placeholder="00.000.000-0">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit">Salvar Cliente</button>
                <a th:href="@{/clientes/listar}" class="btn btn--voltar">Voltar</a>
            </div>
        </form>
    </div>
    </main>
</body>
</html>
