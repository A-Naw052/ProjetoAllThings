<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário | All Things</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/formulario.css">
</head>
<body>

    <!-- ===== CABEÇALHO ===== -->
    <header class="header">
        <div class="header__inner">
            <a href="/" class="logo">
                ALL THINGS <span>tem de tudo</span>
            </a>

            <div class="search-bar">
                <input type="text" placeholder="Digite o que você procura">
                <button type="button" aria-label="Buscar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>

            <div class="header__actions">
                <a href="/fornecedores/listar" class="header__link">Fornecedores</a>
                <a href="/clientes/listar" class="header__link">Clientes</a>
                <a href="/produtos/listar" class="header__link">Produtos</a>
                <a href="/categorias/listar" class="header__link">Categorias</a>
                <a href="#" class="header__icon" aria-label="Favoritos">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 2.5 5 6 5c2 0 3.5 1 6 3.5C14.5 6 16 5 18 5c3.5 0 5.5 3.5 3.5 7.5C19 16.65 12 21 12 21z"></path></svg>
                </a>
                <a href="#" class="header__icon header__icon--cart" aria-label="Carrinho">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path></svg>
                    <span class="cart-count">1</span>
                </a>
            </div>
        </div>
    </header>

    <!-- ===== FORMULÁRIO ===== -->
    <div class="form-wrap">
        <div class="form-page">
            <h1>Cadastro de Usuário</h1>
            <p class="form-page__subtitle">Preencha os dados abaixo para criar um novo acesso</p>

            <form th:action="@{/usuarios/salvar}" method="post" th:object="${usuario}">
                <input type="hidden" th:field="*{idUsuario}">

                <p class="form-page__subtitle">Dados Pessoais</p>

                <div class="form-field">
                    <label for="nomeUsuario">Nome Completo *</label>
                    <input type="text" id="nomeUsuario" th:field="*{nomeUsuario}" placeholder="Ex: João Souza">
                </div>

                <div class="form-field">
                    <label for="cpfUsuario">CPF *</label>
                    <input type="text" id="cpfUsuario" th:field="*{cpfUsuario}" placeholder="000.000.000-00">
                </div>

                <div class="form-field">
                    <label for="emailUsuario">E-mail *</label>
                    <input type="email" id="emailUsuario" th:field="*{emailUsuario}" placeholder="exemplo@email.com">
                </div>

                <p class="form-page__subtitle">Acesso ao Sistema</p>

                <div class="form-row">
                    <div class="form-field">
                        <label for="loginUsuario">Login *</label>
                        <input type="text" id="loginUsuario" th:field="*{loginUsuario}" placeholder="Seu nome de usuário">
                    </div>
                    <div class="form-field">
                        <label for="senhaUsuario">Senha *</label>
                        <input type="password" id="senhaUsuario" th:field="*{senhaUsuario}" placeholder="••••••••">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit">
                        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="vertical-align:-2px; margin-right:6px;">
                            <path d="M5 13l4 4L19 7"/>
                        </svg>
                        Salvar Cadastro
                    </button>
                    <a href="/" class="btn btn--voltar">
                        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="vertical-align:-2px; margin-right:6px;">
                            <path d="M19 12H5M12 5l-7 7 7 7"/>
                        </svg>
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
