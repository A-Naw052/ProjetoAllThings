<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Things | Bem-vindo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>

    <!-- ===== CABEÇALHO SIMPLES ===== -->
    <header class="landing-header">
        <a href="/" class="logo">
            ALL THINGS <span>tem de tudo</span>
        </a>

        <a href="/login" class="btn btn--outline-light">ENTRAR</a>
    </header>

    <!-- ===== HERO DE BOAS-VINDAS ===== -->
    <section class="landing-hero">
        <div class="landing-hero__image img-placeholder">
            <!-- IMAGEM DE FUNDO AQUI -->
            <span>IMAGEM DE FUNDO (1920x1080)</span>
        </div>

        <div class="landing-hero__content">
            <p class="landing-hero__eyebrow">SEJA BEM-VINDO À</p>
            <h1 class="landing-hero__title">ALL THINGS</h1>
            <p class="landing-hero__subtitle">Tudo o que você precisa em um só lugar.</p>

            <div class="landing-hero__actions">
                <a href="/login" class="btn btn--solid">FAZER LOGIN</a>
                <a href="/usuarios/criar" class="btn btn--outline-light">CRIAR CONTA</a>
            </div>
        </div>
    </section>

    <!-- ===== RODAPÉ ===== -->
    <footer class="landing-footer">
        <p>&copy; 2026 All Things — Loja de tudo um pouco. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
